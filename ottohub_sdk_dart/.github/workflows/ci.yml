name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          channel: stable

      - name: Install dependencies
        run: flutter pub get
        working-directory: ottohub_sdk_dart

      - name: Analyze
        run: flutter analyze
        working-directory: ottohub_sdk_dart

      - name: Run tests
        run: flutter test
        working-directory: ottohub_sdk_dart

      - name: Format check
        run: dart format --set-exit-if-changed .
        working-directory: ottohub_sdk_dart

